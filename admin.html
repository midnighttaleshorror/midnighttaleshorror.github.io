<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Panel | Dark Phoenix</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#07070a; --bg-1:#0f0a0d; --panel:#141014;
    --ember-1:#ff5a1f; --ember-2:#ffb020; --ember-3:#8a0f1f;
    --tech-1:#39f7ff; --tech-dim:#1a5a5e;
    --ink:#f2ece3; --ink-dim:#9a9a9f; --line:rgba(255,255,255,0.09);
    --danger:#ff4d5e; --ok:#3ddc84;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg-0); color:var(--ink);
    font-family:'Hind Siliguri','Rajdhani',sans-serif; font-size:16px; line-height:1.5;
    min-height:100vh;
    background-image:radial-gradient(ellipse 60% 30% at 50% -5%, rgba(255,90,31,0.22), transparent 60%);
    background-repeat:no-repeat;
  }
  h1,h2,h3,.brand{font-family:'Chakra Petch','Hind Siliguri',sans-serif;}
  button,input,textarea{font:inherit; color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:2px solid var(--tech-1); outline-offset:2px;}
  .hidden{display:none !important;}

  /* ---------- login ---------- */
  #login{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .login-card{
    width:100%; max-width:440px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:28px 24px;
  }
  .login-card h1{ font-size:1.5rem; margin-bottom:4px; }
  .login-card h1 span{ color:var(--ember-1); }
  .login-card .sub{ color:var(--ink-dim); margin-bottom:22px; font-size:0.95rem; }
  label{ display:block; font-size:0.9rem; color:var(--ink-dim); margin:14px 0 6px; }
  input[type=text], input[type=password], input[type=url], textarea{
    width:100%; background:#0a0709; border:1px solid var(--line); border-radius:6px;
    padding:11px 12px; transition:border-color .2s;
  }
  input:focus, textarea:focus{ border-color:var(--ember-1); outline:none; }
  textarea{ min-height:140px; resize:vertical; }
  input[type=file]{ width:100%; font-size:0.9rem; color:var(--ink-dim); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .check{ display:flex; align-items:center; gap:8px; margin-top:16px; color:var(--ink-dim); font-size:0.92rem; }
  .check input{ width:auto; }
  .hint{ font-size:0.82rem; color:var(--ink-dim); margin-top:6px; }
  .err{ color:var(--danger); margin-top:14px; font-size:0.92rem; min-height:1.2em; }

  .btn{
    border:1px solid var(--line); background:transparent; border-radius:6px;
    padding:9px 16px; font-weight:500; transition:background .2s, border-color .2s, color .2s;
  }
  .btn:hover{ border-color:var(--ink-dim); }
  .btn.primary{ background:var(--ember-1); border-color:var(--ember-1); color:#1a0603; font-weight:600; }
  .btn.primary:hover{ background:var(--ember-2); border-color:var(--ember-2); }
  .btn.danger{ color:var(--danger); border-color:rgba(255,77,94,0.4); }
  .btn.danger:hover{ background:rgba(255,77,94,0.12); border-color:var(--danger); }
  .btn.full{ width:100%; margin-top:20px; padding:12px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  /* ---------- app ---------- */
  header{
    position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 5vw; background:rgba(7,7,10,0.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line);
  }
  .brand{ font-weight:700; letter-spacing:0.03em; }
  .brand span{ color:var(--ember-1); }
  .brand small{ display:block; font-family:'Hind Siliguri',sans-serif; font-weight:400; color:var(--ink-dim); font-size:0.78rem; letter-spacing:0; }
  .head-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .head-actions a.btn{ text-decoration:none; display:inline-block; }

  main{ max-width:900px; margin:0 auto; padding:22px 5vw 80px; }
  .tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:20px; border-bottom:1px solid var(--line); }
  .tab{
    background:none; border:none; border-bottom:2px solid transparent; padding:10px 14px;
    color:var(--ink-dim); font-weight:500; white-space:nowrap;
  }
  .tab.active{ color:var(--ink); border-bottom-color:var(--ember-1); }
  .tab .count{ color:var(--tech-1); font-size:0.85rem; margin-left:4px; }

  .section-head{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .section-head h2{ font-size:1.25rem; }
  .section-note{ color:var(--ink-dim); font-size:0.9rem; margin-bottom:18px; }

  .item{
    display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center;
    padding:12px; margin-bottom:10px; background:var(--panel); border:1px solid var(--line); border-radius:8px;
  }
  .thumb{ width:64px; height:80px; border-radius:5px; object-fit:cover; background:#1a0e12; border:1px solid var(--line); }
  .badge{
    width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--tech-dim); color:var(--tech-1); font-family:'Chakra Petch',sans-serif; font-size:0.9rem;
  }
  .info{ min-width:0; }
  .info .t{ font-weight:600; font-size:1.05rem; overflow-wrap:anywhere; }
  .info .s{ color:var(--ink-dim); font-size:0.88rem; overflow-wrap:anywhere; }
  .acts{ grid-column:1 / -1; display:flex; gap:8px; flex-wrap:wrap; }
  .acts .btn{ padding:6px 14px; font-size:0.9rem; }
  .acts .spacer{ flex:1; }
  .empty{ text-align:center; color:var(--ink-dim); padding:40px 10px; border:1px dashed var(--line); border-radius:8px; }
  @media (min-width:640px){
    .item{ grid-template-columns:auto 1fr auto; }
    .acts{ grid-column:auto; flex-wrap:nowrap; }
    .acts .spacer{ display:none; }
  }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.75);
    display:flex; align-items:flex-start; justify-content:center; padding:4vh 16px; overflow-y:auto;
  }
  .modal{
    width:100%; max-width:520px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:22px 20px;
  }
  .modal h3{ font-size:1.2rem; margin-bottom:4px; }
  .modal .actions{ display:flex; gap:10px; justify-content:flex-end; margin-top:22px; }
  .preview{ display:flex; align-items:center; gap:12px; margin-bottom:8px; color:var(--ink-dim); font-size:0.88rem; }
  .preview img{ width:56px; height:70px; object-fit:cover; border-radius:4px; border:1px solid var(--line); }
  .req{ color:var(--ember-1); }

  /* ---------- busy + toast ---------- */
  #busy{ position:fixed; inset:0; z-index:90; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; text-align:center; padding:20px; }
  .spin{ width:38px; height:38px; border:3px solid var(--line); border-top-color:var(--ember-1); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:95;
    background:#1c161b; border:1px solid var(--line); border-left:3px solid var(--ok);
    padding:12px 18px; border-radius:6px; max-width:90vw; box-shadow:0 8px 30px rgba(0,0,0,.6);
  }
  #toast.bad{ border-left-color:var(--danger); }
  .footer-note{ margin-top:28px; color:var(--ink-dim); font-size:0.85rem; border-left:2px solid var(--tech-dim); padding-left:12px; }
  @media (prefers-reduced-motion:reduce){ .spin{ animation-duration:2s; } }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <form class="login-card" id="loginForm" autocomplete="off">
    <h1>DARK <span>PHOENIX</span></h1>
    <p class="sub">অ্যাডমিন প্যানেল — শুধু আপনার জন্য</p>

    <label for="token">GitHub Token</label>
    <input type="password" id="token" required placeholder="github_pat_...">
    <p class="hint">Token তৈরির নিয়ম আমার মেসেজে দেওয়া আছে। এটা কাউকে দেবেন না।</p>

    <div class="row2">
      <div>
        <label for="owner">GitHub Username</label>
        <input type="text" id="owner" value="midnighttaleshorror" required>
      </div>
      <div>
        <label for="branch">Branch</label>
        <input type="text" id="branch" value="main" required>
      </div>
    </div>
    <label for="repo">Repository</label>
    <input type="text" id="repo" value="midnighttaleshorror.github.io" required>

    <label class="check"><input type="checkbox" id="remember" checked> এই ফোন/ব্রাউজারে মনে রাখো</label>
    <p class="err" id="loginErr"></p>
    <button class="btn primary full" type="submit" id="loginBtn">লগইন</button>
  </form>
</div>

<!-- ================= APP ================= -->
<div id="app" class="hidden">
  <header>
    <div class="brand">DARK <span>PHOENIX</span> <small id="repoLabel"></small></div>
    <div class="head-actions">
      <a class="btn" id="viewSite" href="./" target="_blank" rel="noopener">সাইট দেখুন</a>
      <button class="btn" id="logout" type="button">লগআউট</button>
    </div>
  </header>

  <main>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div id="panel"></div>
    <p class="footer-note">সেভ করার পর সাইটে পরিবর্তন দেখাতে সাধারণত ১–২ মিনিট লাগে (GitHub Pages আপডেট হওয়ার সময়)। না দেখালে পেজ রিফ্রেশ করুন।</p>
  </main>
</div>

<div id="modalRoot"></div>
<div id="busy" class="hidden"><div class="spin"></div><div id="busyMsg">অপেক্ষা করুন…</div></div>
<div id="toast" class="hidden" role="status"></div>

<script>
(function(){
  'use strict';

  /* ---------- helpers ---------- */
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const encPath = p => p.split('/').map(encodeURIComponent).join('/');

  let toastTimer;
  function toast(msg, bad){
    const t = $('#toast');
    t.textContent = msg; t.className = bad ? 'bad' : '';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add('hidden'), bad ? 6000 : 3500);
  }
  function busy(msg){ $('#busyMsg').textContent = msg || 'অপেক্ষা করুন…'; $('#busy').classList.remove('hidden'); }
  function unbusy(){ $('#busy').classList.add('hidden'); }

  /* ---------- default data (used only if data.json doesn't exist yet) ---------- */
  const DEFAULT_DATA = { news:[], gallery:[], series:[], songs:[] };
  function normalize(d){
    ['news','gallery','series','songs'].forEach(k => { if(!Array.isArray(d[k])) d[k] = []; d[k].forEach(it => { if(!it.id) it.id = uid(); }); });
    return d;
  }

  /* ---------- GitHub API ---------- */
  let cfg = null;               // {token, owner, repo, branch}
  const state = { data:null, tab:'news' };

  function api(path, opts = {}){
    return fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/${path}`, {
      cache:'no-store',
      ...opts,
      headers:{
        'Accept':'application/vnd.github+json',
        'Authorization':'Bearer ' + cfg.token,
        'X-GitHub-Api-Version':'2022-11-28',
        ...(opts.headers || {})
      }
    });
  }
  async function apiErr(r){
    let m = ''; try{ m = (await r.json()).message || ''; }catch(_){}
    const e = new Error(m || ('HTTP ' + r.status)); e.status = r.status;
    if(r.status === 401) e.message = 'Token ভুল বা মেয়াদ শেষ। আবার লগইন করুন।';
    else if(r.status === 403) e.message = 'অনুমতি নেই বা limit শেষ। Token-এ "Contents: Read and write" permission আছে কিনা দেখুন। (' + m + ')';
    else if(r.status === 404) e.message = 'Repository/Branch পাওয়া যায়নি, অথবা Token-এর এই repo-তে access নেই।';
    return e;
  }
  async function getFile(path){
    const r = await api(`contents/${encPath(path)}?ref=${encodeURIComponent(cfg.branch)}&_=${Date.now()}`);
    if(r.status === 404) return null;
    if(!r.ok) throw await apiErr(r);
    return r.json();
  }
  async function putFile(path, b64, message, sha){
    const body = { message, content:b64, branch:cfg.branch };
    if(sha) body.sha = sha;
    const r = await api(`contents/${encPath(path)}`, { method:'PUT', body:JSON.stringify(body) });
    if(!r.ok) throw await apiErr(r);
    return r.json();
  }
  async function deleteFile(path, message){
    const f = await getFile(path);
    if(!f) return;
    const r = await api(`contents/${encPath(path)}`, { method:'DELETE', body:JSON.stringify({ message, sha:f.sha, branch:cfg.branch }) });
    if(!r.ok) throw await apiErr(r);
  }

  const decodeUtf8 = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g,'')), c => c.charCodeAt(0)));
  function encodeUtf8(str){
    const bytes = new TextEncoder().encode(str); let bin = '';
    for(let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 8192));
    return btoa(bin);
  }
  const fileToB64 = file => new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(new Error('ফাইল পড়া যায়নি'));
    r.readAsDataURL(file);
  });

  async function loadData(){
    const f = await getFile('data.json');
    state.data = normalize(f ? JSON.parse(decodeUtf8(f.content)) : structuredClone(DEFAULT_DATA));
    return f;
  }

  // Always applies the change to the freshest data.json (retries once on conflict)
  async function saveData(mutator, message){
    for(let attempt = 0; attempt < 2; attempt++){
      const f = await getFile('data.json');
      const data = normalize(f ? JSON.parse(decodeUtf8(f.content)) : structuredClone(DEFAULT_DATA));
      mutator(data);
      try{
        await putFile('data.json', encodeUtf8(JSON.stringify(data, null, 2)), message, f && f.sha);
        state.data = data; render();
        return;
      }catch(e){
        if(attempt === 0 && (e.status === 409 || e.status === 422)) continue;
        throw e;
      }
    }
  }

  /* ---------- uploads ---------- */
  const slug = name => {
    const base = name.replace(/\.[^.]+$/, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
    return base || 'file';
  };
  async function prepImage(file){
    const okType = /^image\/(png|jpe?g|webp)$/.test(file.type);
    const extFromType = { 'image/png':'png', 'image/jpeg':'jpg', 'image/webp':'webp', 'image/gif':'gif' };
    if(!okType){
      return { b64: await fileToB64(file), ext: extFromType[file.type] || (file.name.split('.').pop() || 'img').toLowerCase() };
    }
    const bmp = await createImageBitmap(file);
    const MAX = 1600;
    if(Math.max(bmp.width, bmp.height) <= MAX && file.size < 1.5e6){
      return { b64: await fileToB64(file), ext: extFromType[file.type] };
    }
    const scale = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const isPng = file.type === 'image/png';
    const blob = await new Promise(r => c.toBlob(r, isPng ? 'image/png' : 'image/jpeg', 0.88));
    return { b64: await fileToB64(blob), ext: isPng ? 'png' : 'jpg' };
  }
  async function uploadFile(file, kind){
    let b64, ext;
    if(kind === 'image'){ ({ b64, ext } = await prepImage(file)); }
    else{ b64 = await fileToB64(file); ext = (file.name.split('.').pop() || 'mp3').toLowerCase(); }
    const path = `uploads/${Date.now()}-${slug(file.name)}.${ext}`;
    await putFile(path, b64, `Admin: upload ${path}`);
    return path;
  }
  function referenced(path){
    const d = state.data;
    return d.news.some(x => x.img === path) || d.gallery.some(x => x.img === path) || d.songs.some(x => x.file === path);
  }
  // Only files that were uploaded through this panel (uploads/…) are auto-deleted
  async function cleanupFiles(paths){
    for(const p of new Set(paths.filter(Boolean))){
      if(p.startsWith('uploads/') && !referenced(p)){
        try{ await deleteFile(p, `Admin: delete ${p}`); }catch(e){ console.warn('cleanup failed', p, e); }
      }
    }
  }
  const fileUrl = p => /^https?:\/\//i.test(p) ? p
    : `https://raw.githubusercontent.com/${cfg.owner}/${cfg.repo}/${encodeURIComponent(cfg.branch)}/${encPath(p)}`;

  /* ---------- section config ---------- */
  const TYPES = {
    news:{
      label:'নিউজ', single:'নিউজ', fileKey:'img',
      note:'ছবি ও লেখা সহ নিউজ পোস্ট। সাইটে সবার উপরের সেকশনে দেখায়।',
      fields:[
        { k:'title', l:'শিরোনাম', t:'text', req:true },
        { k:'text',  l:'লেখা', t:'textarea' },
        { k:'img',   l:'ছবি', t:'image' }
      ]
    },
    gallery:{
      label:'গ্যালারি', single:'গ্যালারি ছবি', fileKey:'img',
      note:'ক্যারেক্টারের ছবি ও নাম।',
      fields:[
        { k:'title', l:'নাম', t:'text', req:true },
        { k:'img',   l:'ছবি', t:'image', req:true }
      ]
    },
    series:{
      label:'সিরিজ', single:'এপিসোড',
      note:'Watch Series-এর এপিসোড ও YouTube লিংক।',
      fields:[
        { k:'title', l:'এপিসোডের নাম', t:'text', req:true },
        { k:'genre', l:'লেবেল (যেমন: Episode 6)', t:'text' },
        { k:'link',  l:'YouTube / ভিডিও লিংক', t:'url', req:true }
      ]
    },
    songs:{
      label:'গান', single:'গান', fileKey:'file',
      note:'MP3 ফাইল আপলোড করুন। সাইটে Play ও Download দুটোই থাকে।',
      fields:[
        { k:'title', l:'গানের নাম', t:'text', req:true },
        { k:'genre', l:'ধরন (যেমন: Theme Song)', t:'text' },
        { k:'file',  l:'MP3 ফাইল', t:'audio', req:true }
      ]
    }
  };

  /* ---------- render ---------- */
  function render(){
    const d = state.data; if(!d) return;
    $('#tabs').innerHTML = Object.keys(TYPES).map(k =>
      `<button class="tab ${state.tab === k ? 'active' : ''}" role="tab" data-tab="${k}">${TYPES[k].label}<span class="count">${d[k].length}</span></button>`
    ).join('');

    const t = state.tab, T = TYPES[t], items = d[t];
    let html = `
      <div class="section-head">
        <h2>${T.label}</h2>
        <button class="btn primary" data-act="add">+ নতুন ${T.single}</button>
      </div>
      <p class="section-note">${T.note}</p>`;

    if(!items.length){
      html += `<div class="empty">এখনো কিছু নেই। উপরের বাটনে চাপ দিয়ে যোগ করুন।</div>`;
    }
    items.forEach((it, i) => {
      let lead, title = esc(it.title), sub = '';
      if(t === 'news' || t === 'gallery'){
        lead = it.img ? `<img class="thumb" loading="lazy" src="${esc(fileUrl(it.img))}" alt="">` : `<div class="badge">—</div>`;
        sub = t === 'news' ? esc((it.text || '').replace(/\s+/g, ' ').slice(0, 80)) : '';
      }else if(t === 'series'){
        lead = `<div class="badge">${String(i + 1).padStart(2, '0')}</div>`;
        sub = esc([it.genre, it.link].filter(Boolean).join(' • '));
      }else{
        lead = `<div class="badge">${String(i + 1).padStart(2, '0')}</div>`;
        sub = esc([it.genre, (it.file || '').split('/').pop()].filter(Boolean).join(' • '));
      }
      html += `
        <div class="item" data-id="${esc(it.id)}">
          ${lead}
          <div class="info"><div class="t">${title}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>
          <div class="acts">
            <button class="btn" data-act="up" ${i === 0 ? 'disabled' : ''} aria-label="উপরে">↑</button>
            <button class="btn" data-act="down" ${i === items.length - 1 ? 'disabled' : ''} aria-label="নিচে">↓</button>
            <span class="spacer"></span>
            <button class="btn" data-act="edit">এডিট</button>
            <button class="btn danger" data-act="del">ডিলিট</button>
          </div>
        </div>`;
    });
    $('#panel').innerHTML = html;
  }

  /* ---------- modal (add / edit) ---------- */
  function openForm(type, id){
    const T = TYPES[type];
    const item = id ? state.data[type].find(x => x.id === id) : null;
    const fieldsHtml = T.fields.map(f => {
      const val = item ? (item[f.k] || '') : '';
      const star = f.req && !(f.t === 'image' || f.t === 'audio' ? item : false) ? ' <span class="req">*</span>' : '';
      if(f.t === 'textarea') return `<label for="f_${f.k}">${f.l}</label><textarea id="f_${f.k}" name="${f.k}">${esc(val)}</textarea>`;
      if(f.t === 'image' || f.t === 'audio'){
        const cur = item && val
          ? (f.t === 'image'
              ? `<div class="preview"><img src="${esc(fileUrl(val))}" alt=""><span>বর্তমান ছবি — নতুন ছবি বেছে নিলে বদলে যাবে</span></div>`
              : `<div class="preview"><span>বর্তমান ফাইল: ${esc(val.split('/').pop())} — নতুন ফাইল বেছে নিলে বদলে যাবে</span></div>`)
          : '';
        const accept = f.t === 'image' ? 'image/*' : 'audio/mpeg,audio/*,.mp3';
        return `<label for="f_${f.k}">${f.l}${star}</label>${cur}<input type="file" id="f_${f.k}" name="${f.k}" accept="${accept}">`;
      }
      return `<label for="f_${f.k}">${f.l}${star}</label><input type="${f.t}" id="f_${f.k}" name="${f.k}" value="${esc(val)}" ${f.t === 'url' ? 'placeholder="https://"' : ''}>`;
    }).join('');

    $('#modalRoot').innerHTML = `
      <div class="overlay" id="overlay">
        <form class="modal" id="itemForm" novalidate>
          <h3>${item ? 'এডিট' : 'নতুন'}: ${T.single}</h3>
          ${fieldsHtml}
          <p class="err" id="formErr"></p>
          <div class="actions">
            <button type="button" class="btn" id="cancelForm">বাতিল</button>
            <button type="submit" class="btn primary">সেভ করুন</button>
          </div>
        </form>
      </div>`;
    const first = $('#itemForm input, #itemForm textarea'); if(first) first.focus();

    $('#cancelForm').onclick = closeForm;
    $('#overlay').addEventListener('mousedown', e => { if(e.target.id === 'overlay') closeForm(); });
    $('#itemForm').onsubmit = e => { e.preventDefault(); submitForm(type, item); };
  }
  function closeForm(){ $('#modalRoot').innerHTML = ''; }

  async function submitForm(type, item){
    const T = TYPES[type], err = $('#formErr'); err.textContent = '';
    const vals = {}, files = {};
    for(const f of T.fields){
      const el = $('#f_' + f.k);
      if(f.t === 'image' || f.t === 'audio'){
        const file = el.files[0];
        if(file){
          if(f.t === 'image' && !file.type.startsWith('image/')){ err.textContent = 'শুধু ছবির ফাইল দিন।'; return; }
          if(f.t === 'audio' && !(file.type.startsWith('audio/') || /\.mp3$/i.test(file.name))){ err.textContent = 'শুধু গানের (MP3) ফাইল দিন।'; return; }
          if(file.size > 95 * 1024 * 1024){ err.textContent = 'ফাইল খুব বড় (৯৫ MB এর কম হতে হবে)।'; return; }
          files[f.k] = file;
        }else if(f.req && !item){ err.textContent = `"${f.l}" বেছে নিন।`; return; }
      }else{
        vals[f.k] = el.value.trim();
        if(f.req && !vals[f.k]){ err.textContent = `"${f.l}" লিখুন।`; return; }
        if(f.t === 'url' && !/^https?:\/\//i.test(vals[f.k])){ err.textContent = 'লিংক http:// বা https:// দিয়ে শুরু হতে হবে।'; return; }
      }
    }
    const big = Object.values(files).find(f => f.size > 25 * 1024 * 1024);
    if(big && !confirm('ফাইলটা ২৫ MB এর বেশি, আপলোড হতে সময় লাগবে। চালিয়ে যাবেন?')) return;

    closeForm();
    const newId = uid(), oldPaths = [];
    try{
      const uploaded = {};
      for(const k of Object.keys(files)){
        busy(`ফাইল আপলোড হচ্ছে… (${files[k].name})`);
        uploaded[k] = await uploadFile(files[k], T.fields.find(f => f.k === k).t === 'image' ? 'image' : 'audio');
      }
      busy('সেভ হচ্ছে…');
      await saveData(d => {
        const list = d[type];
        if(item){
          const it = list.find(x => x.id === item.id);
          if(!it) throw new Error('আইটেমটা আর পাওয়া যাচ্ছে না (অন্য জায়গা থেকে মুছে গেছে?)');
          Object.assign(it, vals);
          Object.keys(uploaded).forEach(k => { oldPaths.push(it[k]); it[k] = uploaded[k]; });
        }else{
          list.push({ id:newId, ...vals, ...uploaded });
        }
      }, `Admin: ${item ? 'edit' : 'add'} ${type}`);
      if(oldPaths.length){ busy('পুরনো ফাইল মুছছে…'); await cleanupFiles(oldPaths); }
      toast('সেভ হয়েছে ✓');
    }catch(e){
      console.error(e); toast(e.message || 'কিছু একটা সমস্যা হয়েছে', true);
    }finally{ unbusy(); }
  }

  /* ---------- panel actions ---------- */
  async function move(type, id, dir){
    busy('সেভ হচ্ছে…');
    try{
      await saveData(d => {
        const l = d[type], i = l.findIndex(x => x.id === id), j = i + dir;
        if(i < 0 || j < 0 || j >= l.length) return;
        [l[i], l[j]] = [l[j], l[i]];
      }, `Admin: reorder ${type}`);
    }catch(e){ toast(e.message, true); }
    finally{ unbusy(); }
  }
  async function remove(type, id){
    const it = state.data[type].find(x => x.id === id); if(!it) return;
    if(!confirm(`"${it.title}" ডিলিট করবেন? এটা আর ফেরানো যাবে না।`)) return;
    busy('ডিলিট হচ্ছে…');
    const paths = [];
    try{
      await saveData(d => {
        const l = d[type], i = l.findIndex(x => x.id === id);
        if(i < 0) return;
        const [gone] = l.splice(i, 1);
        paths.push(gone.img, gone.file);
      }, `Admin: delete ${type}`);
      await cleanupFiles(paths);
      toast('ডিলিট হয়েছে ✓');
    }catch(e){ toast(e.message, true); }
    finally{ unbusy(); }
  }

  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if(!b) return;
    state.tab = b.dataset.tab; render();
  });
  $('#panel').addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if(!b) return;
    const act = b.dataset.act, row = b.closest('.item'), id = row && row.dataset.id, t = state.tab;
    if(act === 'add') openForm(t);
    else if(act === 'edit') openForm(t, id);
    else if(act === 'del') remove(t, id);
    else if(act === 'up') move(t, id, -1);
    else if(act === 'down') move(t, id, 1);
  });
  document.addEventListener('keydown', e => { if(e.key === 'Escape' && $('#modalRoot').innerHTML) closeForm(); });

  /* ---------- login / logout ---------- */
  const STORE_KEY = 'mth_admin_cfg';
  async function enter(c, remember){
    cfg = c;
    const r = await api('');
    if(!r.ok) throw await apiErr(r);
    const info = await r.json();
    if(info.permissions && info.permissions.push === false) throw new Error('এই Token দিয়ে repo-তে লেখার অনুমতি নেই। "Contents: Read and write" দিন।');
    await loadData();
    const s = JSON.stringify(c);
    (remember ? localStorage : sessionStorage).setItem(STORE_KEY, s);
    (remember ? sessionStorage : localStorage).removeItem(STORE_KEY);
    $('#repoLabel').textContent = `${c.owner}/${c.repo}`;
    $('#viewSite').href = `https://${c.owner}.github.io/` + (c.repo.toLowerCase() === `${c.owner.toLowerCase()}.github.io` ? '' : c.repo + '/');
    $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
    render();
  }
  $('#loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('#loginBtn'), err = $('#loginErr'); err.textContent = ''; btn.disabled = true; btn.textContent = 'যাচাই হচ্ছে…';
    try{
      await enter({
        token: $('#token').value.trim(), owner: $('#owner').value.trim(),
        repo: $('#repo').value.trim(), branch: $('#branch').value.trim() || 'main'
      }, $('#remember').checked);
    }catch(ex){ err.textContent = ex.message || 'লগইন করা যায়নি'; }
    finally{ btn.disabled = false; btn.textContent = 'লগইন'; }
  });
  $('#logout').addEventListener('click', () => {
    localStorage.removeItem(STORE_KEY); sessionStorage.removeItem(STORE_KEY);
    cfg = null; state.data = null; $('#token').value = '';
    $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  });

  // auto-login if a saved session exists
  (async function(){
    const saved = localStorage.getItem(STORE_KEY) || sessionStorage.getItem(STORE_KEY);
    if(!saved) return;
    try{
      const c = JSON.parse(saved);
      $('#owner').value = c.owner; $('#repo').value = c.repo; $('#branch').value = c.branch;
      busy('লগইন হচ্ছে…');
      await enter(c, !!localStorage.getItem(STORE_KEY));
    }catch(ex){ $('#loginErr').textContent = ex.message || ''; }
    finally{ unbusy(); }
  })();
})();
</script>
</body>
</html>
