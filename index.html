<script>
  // ---- intro / welcome screen ----
    (function(){
      const introEl = document.getElementById('intro-screen');
      const introText = document.getElementById('introText');
      const message = 'WELCOME TO PROJECT PHOENIX';
  
      introText.innerHTML = message.split('').map((ch,i)=>
        `<span style="animation-delay:${i*0.045}s">${ch === ' ' ? '&nbsp;' : ch}</span>`
      ).join('');
  
      let hasSpoken = false;
      function pickFemaleVoice(voices){
        const knownFemaleNames = ['female','zira','samantha','victoria','susan','fiona','moira','tessa','karen','google uk english female','google us english'];
        let match = voices.find(v => /en/i.test(v.lang) && knownFemaleNames.some(n => v.name.toLowerCase().includes(n)));
        if(match) return match;
        match = voices.find(v => /en/i.test(v.lang));
        return match || voices[0];
      }
      function speakWelcome(){
        if(hasSpoken) return;
        hasSpoken = true;
        if('speechSynthesis' in window){
          const utter = new SpeechSynthesisUtterance('Welcome to Project Phoenix');
          utter.rate = 0.95;
          utter.pitch = 1.25;
          utter.volume = 1;
          const voices = speechSynthesis.getVoices();
          if(voices.length){
            utter.voice = pickFemaleVoice(voices);
          }
          speechSynthesis.speak(utter);
        }
      }
  
      function dismissIntro(){
        introEl.classList.add('hide');
      }
  
      window.addEventListener('load', speakWelcome);
      introEl.addEventListener('click', () => { speakWelcome(); dismissIntro(); });
  
      setTimeout(dismissIntro, 4200);
    })();
</script>
